name: Daily update

# Brings the current year up to today: NOAA nClimGrid observations, the
# National Blend of Models forecast, then normals. Reuses the long-term layers
# already published on gh-pages and republishes the site.

on:
  schedule:
    - cron: "37 13 * * *"   # nClimGrid prelim posts ~08 UTC; NBM 00z by ~02 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: published }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt

      - name: Restore published layers and climatology
        run: |
          cp -r published/data/. site/data/
          python pipeline/build_site.py --restore

      - name: Observations to date, forecast, projection
        run: |
          Y=$(date -u +%Y); M=$(date -u +%-m)
          YEARS="$Y"; [ "$M" -le 3 ] && YEARS="$((Y - 1)) $Y"
          python pipeline/engine.py grids $YEARS --jobs 2
          python pipeline/nowcast.py
          if [ "$M" -le 3 ]; then python pipeline/build_site.py --years $((Y - 1)); else python pipeline/build_site.py; fi
          python pipeline/assemble_page.py

      - run: python tests/test_pipeline.py

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          commit_message: "Daily update"
